name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Tombol manual di tab Actions GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev lldb wget

        # Fix libtinfo5 missing package on Ubuntu 24.04 runner
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb || wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5*.deb || sudo apt-get install -f -y

    - name: Install Python Dependencies & Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython buildozer pillow UnityPy

    - name: Build APK with Buildozer
      run: |
        # Menggunakan 'yes' untuk otomatis menerima lisensi Android SDK yang tertahan
        yes | buildozer -v android debug || buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unitypy-swapper-apk
        path: bin/*.apk
